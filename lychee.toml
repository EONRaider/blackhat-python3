# Link checker configuration (https://lychee.cli.rs/).
exclude_path = ["chapter\\d+/", "\\.venv/"]
accept = ["200..=299", "429"]
max_retries = 3
exclude = [
  # Created by the first tagged release.
  "^https://github\\.com/EONRaider/[^/]+/releases/latest",
  "^https://github\\.com/EONRaider/[^/]+/compare/",
  "^https://github\\.com/EONRaider/[^/]+/releases/tag/",
  # Workflow pages and badges only exist once the workflow is on the default branch.
  "^https://github\\.com/EONRaider/[^/]+/actions/workflows/",
  # Blocks automated clients.
  "^https://stackoverflow\\.com/",
  # Require a signed-in browser session.
  "^https://codespaces\\.new/",
  "^https://github\\.com/EONRaider/[^/]+/security/advisories/new",
  "^https://github\\.com/EONRaider/[^/]+/discussions",
]
